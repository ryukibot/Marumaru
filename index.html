<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>深層脱出</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* 配置: 上に状態バー。役割選択は左右2枚のカード。ロビーは左=部屋番号と操作・通信状態、右=生存者3枠 */
:root{
  color-scheme:dark;
  --bg:#14181a; --panel:#1c2225; --panel-2:#252c30; --line:#364047;
  --fg:#e7e2d3; --dim:#98a3a6; --ink:#14181a;
  --inf:#b7d94a; --haz:#f2c230;
  --p1:#f0902e; --p2:#4eb2c9; --p3:#b69cf0;
  --ok:#8cc152; --warn:#e8c545; --bad:#e5533d;
  --f-display:"Big Shoulders Display","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;border-radius:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button[disabled]{cursor:default}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;gap:14px;padding-block:14px;min-height:100vh;max-width:1100px;margin-inline:auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:3px;line-height:1}
.brand b{font:900 32px/1 var(--f-display);letter-spacing:.1em}
.brand span{font-size:11px;color:var(--dim);letter-spacing:.2em}
.sp{margin-left:auto}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border:1px solid var(--line);background:var(--panel-2);font:600 12.5px var(--f-mono);letter-spacing:.02em;white-space:nowrap}
.chip.good{border-color:var(--ok);color:var(--ok)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip i{width:8px;height:8px;background:currentColor;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 24px;border:1px solid var(--line);background:var(--panel-2);font-weight:900;letter-spacing:.1em;font-size:16px}
.btn.inf{background:var(--inf);border-color:var(--inf);color:var(--ink)}
.btn.sv{background:var(--haz);border-color:var(--haz);color:var(--ink)}
.btn.line{background:none}
.btn.on{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.btn[disabled]{opacity:.38}
.btn.small{min-height:44px;font-size:14px;padding:0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--pc,var(--fg));padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font:900 30px/1.1 var(--f-display);letter-spacing:.06em}
.panel p{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
.tag{font:900 26px/1 var(--f-display);color:var(--ink);background:var(--pc,var(--fg));padding:5px 11px 4px;letter-spacing:.05em;flex:none}
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.2em;color:var(--pc,var(--dim))}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.role{min-height:260px}
.role .btn{margin-top:auto}
.role.inf{--pc:var(--inf)}
.role.sv{--pc:var(--haz)}
.note{font-size:12.5px;color:var(--dim);line-height:1.6}
.note b{color:var(--fg)}
.backrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.backrow h2{margin:0;font:900 28px/1 var(--f-display);letter-spacing:.06em}
.codeform{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.codeform input{min-height:54px;width:9em;padding:0 14px;background:#0e1214;border:1px solid var(--line);color:var(--fg);font:600 28px var(--f-mono);letter-spacing:.3em;text-align:center;-webkit-user-select:text;user-select:text}
.err{color:var(--bad);font-size:14px;min-height:21px}
.room{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
@media (max-width:760px){.room{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.bigcode{font:900 clamp(64px,14vw,104px)/1 var(--f-display);letter-spacing:.16em;color:var(--inf);padding-left:.16em}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;min-height:76px;padding:10px 14px;border:1px solid var(--line);background:var(--panel-2);border-left:4px solid var(--pc)}
.slot.vacant{opacity:.55;border-left-color:var(--line)}
.slot.vacant .tag{background:var(--line);color:var(--dim)}
.sl-main{display:flex;flex-direction:column;min-width:0}
.sl-main b{font-size:16px}
.sl-main small{color:var(--dim);font-size:12px}
.sl-st{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.mybadge{display:flex;align-items:center;gap:14px}
.mybadge .tag{font-size:52px;padding:8px 20px 6px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;align-items:baseline;font-size:14px;margin:0}
.kv dt{color:var(--dim)}
.kv dd{margin:0;font:600 18px var(--f-mono);font-variant-numeric:tabular-nums}
.verdict{padding:10px 12px;border:1px solid var(--line);background:var(--panel-2);font-size:14px;line-height:1.55}
.verdict.good{border-color:var(--ok)}
.verdict.warn{border-color:var(--warn)}
.verdict.bad{border-color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.chip i.live{animation:blink 1.2s steps(2) infinite}}
@keyframes blink{50%{opacity:.25}}
#dbg{margin-top:auto;border:1px solid var(--line);background:var(--panel);padding:8px 12px;font-size:12.5px;color:var(--dim)}
#dbg summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
#log{margin:6px 0 0;font:500 12px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-all;color:var(--fg);-webkit-user-select:text;user-select:text;max-height:260px;overflow:auto}
#notice{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;z-index:5}
.nt{padding:10px 14px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;font-size:14px}
.nt.bad{border-color:var(--bad);color:var(--bad);background:#2a1816}
.nt.good{border-color:var(--ok);color:var(--ok)}
.nt.warn{border-color:var(--warn);color:var(--warn)}
/* ゲーム本編の画面 */
.cams{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cb{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--panel-2);font-weight:900;font-size:13px;letter-spacing:.06em;display:inline-flex;align-items:center;gap:6px}
.cb small{color:var(--inf);font:600 12px var(--f-mono)}
.cb.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.cb.on small{color:var(--ink)}
.camnote{font-size:12.5px;color:var(--dim);margin-left:auto}
.gm{display:flex;flex-direction:column;gap:14px;min-width:0}
.hrow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hrow h2{margin:2px 0 0;font:900 28px/1.1 var(--f-display);letter-spacing:.06em}
.hbox{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;min-width:90px}
.hbox+.hbox{margin-left:0}
.hbox small{font-size:11px;color:var(--dim);letter-spacing:.14em}
.hbox b{font-size:26px;line-height:1.1}
.gauge{height:10px;background:#0e1214;position:relative}
.gauge i{position:absolute;inset:0 auto 0 0;background:var(--inf)}
.surv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.sv{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);background:var(--panel-2);border-left:4px solid var(--pc);min-width:0}
.sv.off{opacity:.45}
.sv span:last-child{display:flex;flex-direction:column;min-width:0}
.sv b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv small{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tl{display:grid;grid-template-columns:auto auto;grid-template-areas:"b n" "b c";gap:0 10px;align-items:center;min-height:54px;padding:6px 14px;border:1px solid var(--line);background:var(--panel-2)}
.tl b{grid-area:b;width:32px;height:32px;display:grid;place-items:center;background:var(--tc);color:var(--ink);font:900 17px var(--f-body)}
.tl span{grid-area:n;font-weight:700;font-size:14px}
.tl small{grid-area:c;font-size:12px;color:var(--dim)}
.tl.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.tl[disabled]{opacity:.45}
.cvwrap{overflow:auto;border:1px solid var(--line);background:#0d1213;max-width:100%}
.cvwrap canvas{display:block;margin:0 auto;touch-action:manipulation}
.shop{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.shop{grid-template-columns:minmax(0,1fr)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabb{min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--panel-2);font-weight:900;letter-spacing:.06em}
.tabb.on{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.ilist{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;-webkit-overflow-scrolling:touch}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--panel-2)}
.im{display:flex;flex-direction:column;gap:3px;min-width:0}
.im small{color:var(--dim);font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:4px}
.stats .chip{min-height:22px;font-size:11.5px}
.ib{display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.ib small{color:var(--dim);font-size:11.5px}
.price{font-size:20px;font-weight:600}
.eqg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.eq{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line);background:var(--panel-2);min-width:0}
.eq.vac{opacity:.6}
.eq small{font-size:11px;color:var(--dim);letter-spacing:.1em}
.eq b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq .btn{margin-top:4px;min-height:36px;font-size:12px;padding:0 10px}
.own{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.orow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border:1px solid var(--line);background:var(--panel-2);font-size:14px}
.obt{display:flex;gap:6px}
.obt .btn{min-height:36px;font-size:12px;padding:0 10px}
.kv2{display:flex;flex-direction:column;gap:6px}
.kvrow{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border:1px solid var(--line);background:var(--panel-2);font-size:14px}
.kvrow span{color:var(--dim)}
.empty{padding:14px;border:1px dashed var(--line);color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>深層脱出</b><span>研究施設 最深部から地上へ</span></div>
    <span class="sp"></span>
    <span id="stat" class="chip"><i></i>通信 未接続</span>
  </header>
  <div id="notice"></div>
  <main id="main"></main>
  <details id="dbg" open><summary>通信ログ(つながらないとき、ここの内容を教えてください)</summary><pre id="log"></pre></details>
</div>

<script>

      if(!dirs.length)continue;
      const [nx,ny]=dirs[ri(0,dirs.length-1)];

        const c=cand.splice(ri(0,cand.length-1),1)[0];used.add(c[1]*W+c[0]);
        loot.push([rollVariant(e.id,Math.min(5,diff+1),rnd),ri((e.n||[1,1])[0],(e.n||[1,1])[1]),c[0]+.5,c[1]+.5]);
      }

      }
      for(let k=0;k<2&&cand.length;k++){

        if(k===0&&wtab.length)loot.push([rollVariant(pickW(rnd,wtab).id,Math.min(5,diff+1),rnd),1,c[0]+.5,c[1]+.5]);
        else{const e2=pickW(rnd,table.filter(l=>_base[l.id].cat==='ammo'||l.id==='bandage'));loot.push([e2.id,ri(e2.n[0],e2.n[1]),c[0]+.5,c[1]+.5])}

    }
  }
  /* 壊せる鍵つき扉の奥にも、少し物資を置く */
  if(breakInfo.length){
    const bt=table.filter(l=>['ammo556','ammo9','ammo357','ammo12','medkit','bandage','parts','fabric','frag','flash'].includes(l.id)),doneB=new Set();
    for(const li of breakInfo){

      const cand=[];
      for(let y=li.far[1]-3;y<=li.far[1]+3;y++)for(let x=li.far[0]-3;x<=li.far[0]+3;x++){
        if(x<0||y<0||x>=W||y>=H||g[y][x]!==0||used.has(y*W+x))continue;
        if(dist[y*W+x]>li.d-1)cand.push([x,y]);
      }
      for(let k=0;k<2&&cand.length;k++){
        const e2=pickW(rnd,bt),c=cand.splice(ri(0,cand.length-1),1)[0];used.add(c[1]*W+c[0]);
        loot.push([e2.id,ri(e2.n[0],e2.n[1]),c[0]+.5,c[1]+.5]);
      }
    }
  }
  /* カードキー: Lv k のカードは、Lv k 未満の扉だけで行ける範囲に置く(取れない配置にならない) */
  if(maxLv){
    const usedLv=new Set(Object.values(lockLv));
    for(let k=1;k<=maxLv;k++){
      if(!usedLv.has(k))continue;
      const rg=regionOf(k),cs=[];let mx=0;
      for(let i=0;i<rg.length;i++)if(rg[i]>mx)mx=rg[i];
      for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
        if(g[y][x]!==0||used.has(y*W+x)||rg[y*W+x]<Math.min(10,mx*.5))continue;
        if(x<bx0||x>bx1||y<by0||y>by1)continue;

      loot.push(['key'+k,1,c[0]+.5,c[1]+.5]);
    }
  }
  return {W,H,map:g,start,enemies,loot,exitY:by1+1.2,doorX:cx,
    bld:{x:bx0+1,y:by0+1,w:bx1-bx0-1,h:by1-by0-1},rooms:leaves.length,seed,breaker,blackout,lockLv,pipes,plant:!!cfg.plant,vent:!!cfg.vent};
}
function genHall(cfg,diff,seed){

  for(let x=0;x<W;x++){g[0][x]=1;g[H-1][x]=1}
  for(let y=0;y<H;y++){g[y][0]=1;g[y][W-1]=1}

  const inner=by1-by0-1,dT=Math.floor((inner-5)/2);

  for(let x=dx0;x<dx0+dw;x++)doors.push([x,by1]);

      const [w,h]=shapes[ri(0,shapes.length-1)];

      let ok=true;

        if(j<0||i<0||j>=H||i>=W){ok=false;break}
        const inside=i>=x&&i<x+w&&j>=y&&j<y+h;
        if(inside&&(g[j][i]!==0||near(i,j,1)))ok=false;
        if(inside&&r===lobby&&Math.abs(i-cx)<3&&j>=lobby.y1-2)ok=false;
      }

      for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)g[j][i]=2;

        if(g[y-1][x]===1||g[y+1][x]===1||g[y][x-1]===1||g[y][x+1]===1)cs.push([x,y]);
      }
    }
    if(!cs.length)return null;
    const c=cs[ri(0,cs.length-1)];used.add(c[1]*W+c[0]);breaker={x:c[0]+.5,y:c[1]+.5};
  }
  const blackout=rnd()<cfg.blackout[diff];

  const mix=cfg.mix.map(([t,w],i)=>({t,w:i?w+cfg.mixPerDiff[diff]:w}));
  const putEnemy=cells=>{
    for(let guard=0;guard<60;guard++){
      const c=cells[ri(0,cells.length-1)];
      if(Math.hypot(c[0]+.5-start[0][0],c[1]+.5-start[0][1])<7||used.has(c[1]*W+c[0]))continue;
      used.add(c[1]*W+c[0]);

    }

  const place=(entry,cells)=>{

    bld:{x:bx0+1,y:by0+1,w:bx1-bx0-1,h:by1-by0-1},rooms:rooms.length,seed,vaults:vaults.length,breaker,blackout};
}

  const put=(x,y,v)=>{if(x<1||y<1||x>=W-1||y>=H-1)return;g[y][x]=v;const [a,b]=mir(x,y);g[b][a]=v};
  /* 遮蔽物: 壁のかたまりと木箱 */
  for(let k=0,n=0;n<14&&k<300;k++){
    const w=ri(1,3),h=ri(1,3),x=ri(6,W-7),y=ri(3,H-4);
    let ok=true;
    for(let yy=y-1;yy<=y+h&&ok;yy++)for(let xx=x-1;xx<=x+w;xx++){if(g[yy]&&g[yy][xx]!==0){ok=false;break}if(near(xx,yy,4)){ok=false;break}}
    if(!ok)continue;
    const [mx,my]=mir(x+w-1,y+h-1);if(mx<x+w+1&&mx+w>x-1&&my<y+h+1&&my+h>y-1)continue;
    const v=rnd()<.35?2:1;
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)put(xx,yy,v);
    n++;
  }
  /* 中央に低い壁のリング(ひらけた所と遮蔽の混ぜ具合) */
  const cx=W>>1,cy=H>>1;
  for(let d=-2;d<=2;d++){if(d!==0){put(cx+d-1,cy-3,2)}}
  const used=new Set(),free=(x,y)=>g[y][x]===0&&!used.has(y*W+x)&&!near(x,y,3.2);
  const loot=[],cnt={},table=cfg.loot.filter(l=>(l.minDiff||1)<=diff);
  const mark=(x,y)=>{used.add(y*W+x);const [a,b]=mir(x,y);used.add(b*W+a)};
  for(let k=0,n=cfg.pairs[diff],g0=0;k<n&&g0<800;g0++){
    const x=ri(2,W-3),y=ri(2,H-3);if(!free(x,y)||used.has(y*W+x))continue;
    const pool=table.filter(l=>!l.max||(cnt[l.id]||0)<l.max);
    const e=pickW(rnd,pool),id=rollVariant(e.id,diff,rnd),nn=ri(e.n[0],e.n[1]);
    cnt[e.id]=(cnt[e.id]||0)+1;
    const [a,b]=mir(x,y);
    loot.push([id,nn,x+.5,y+.5],[id,nn,a+.5,b+.5]);mark(x,y);k++;
  }
  const enemies=[];

}
function genLevel(fac,diff,seed){

  if(cfg.layout==='arena')return genArena(cfg,diff,seed);
  for(let a=0;a<60;a++){const lv=(cfg.layout==='hall'?genHall:genTry)(cfg,diff,(seed+a*7919)>>>0);if(lv)return lv}

}
/* 複数階: 階ごとにマップを作り、階段でつなぐ。1階にだけ脱出口がある */
function bfsDistMap(map,W,H,sx,sy){
  const d=new Int16Array(W*H).fill(-1),q=[sy*W+sx];d[sy*W+sx]=0;
  for(let h=0;h<q.length;h++){
    const c=q[h],x=c%W,y=(c/W)|0;
    for(const [ax,ay] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+ax,ny=y+ay;
      if(nx<0||ny<0||nx>=W||ny>=H||d[ny*W+nx]>=0)continue;
      const v=map[ny][nx];if(v!==0&&v!==3&&v!==5)continue;
      d[ny*W+nx]=d[c]+1;q.push(ny*W+nx);
    }
  }
  return d;
}
function genMission(fac,diff,seed){
  const n=floorCount(fac,diff),lvs=[];
  for(let i=0;i<n;i++){const lv=genLevel(fac,diff,(seed+i*104729)>>>0);lv.fi=i;lv.nf=n;lv.stairs=[];if(i>0)lv.exitY=1e9;lvs.push(lv)}
  const rnd=mulberry32((seed^0x5bd1e995)>>>0),pick=a=>a[Math.floor(rnd()*a.length)];
  const cand=lv=>{
    const {W,H,map,bld}=lv,sx=Math.floor(lv.start[0][0]),sy=Math.floor(lv.start[0][1]);
    const dist=bfsDistMap(map,W,H,sx,sy);
    const occ=[...lv.loot.map(l=>[l[2],l[3]]),...lv.enemies.map(e=>[e[1],e[2]])];
    const out=[];
    for(let y=bld.y+1;y<bld.y+bld.h-1;y++)for(let x=bld.x+1;x<bld.x+bld.w-1;x++){
      if(dist[y*W+x]<0||map[y][x]!==0)continue;
      let ok=true;
      for(let ay=-1;ay<=1&&ok;ay++)for(let ax=-1;ax<=1;ax++)if(map[y+ay][x+ax]!==0){ok=false;break}
      if(!ok)continue;
      if(occ.some(o=>Math.hypot(o[0]-x-.5,o[1]-y-.5)<2.5))continue;
      out.push([x,y,dist[y*W+x]]);
    }
    return {out,dist};
  };
  for(let i=0;i<n;i++){
    const lv=lvs[i],{out:cs}=cand(lv);
    if(!cs.length)continue;
    let prev=null;
    if(i>0){prev=pick(cs.filter(c=>c[2]>5).length?cs.filter(c=>c[2]>5):cs);lv.stairs.push({x:prev[0]+.5,y:prev[1]+.5,to:i-1})}
    if(i<n-1){
      let pool;
      if(prev){
        const d2=bfsDistMap(lv.map,lv.W,lv.H,prev[0],prev[1]);
        pool=cs.map(c=>[c[0],c[1],d2[c[1]*lv.W+c[0]]]).filter(c=>c[2]>0).sort((a,b)=>b[2]-a[2]);
      }else pool=cs.slice().sort((a,b)=>b[2]-a[2]);
      const top=pool.slice(0,Math.max(1,Math.ceil(pool.length*.4)));
      const c=pick(top);lv.stairs.push({x:c[0]+.5,y:c[1]+.5,to:i+1});
    }
  }
  /* 目標物資: 最後の階の、入口から遠い側(奥の半分)のどこかに置く。持ち帰らないと作戦成功にならない */
  const last=lvs[n-1];
  if(last&&!last.arena){
    /* 距離は、その階に着く場所(上の階から来る階段、1階建てなら入口)から測る */
    const o=n>1&&last.stairs.length?last.stairs[0]:{x:last.start[0][0],y:last.start[0][1]};
    const dist=bfsDistMap(last.map,last.W,last.H,Math.floor(o.x),Math.floor(o.y));
    const occ=[...last.loot.map(l=>[l[2],l[3]]),...last.enemies.map(e=>[e[1],e[2]]),...last.stairs.map(t=>[t.x,t.y])];
    const bd=last.bld||{x:1,y:1,w:last.W-2,h:last.H-2};
    let pool=[];
    for(let y=bd.y;y<bd.y+bd.h;y++)for(let x=bd.x;x<bd.x+bd.w;x++){
      if(y<1||x<1||y>=last.H-1||x>=last.W-1||last.map[y][x]!==0||!(dist[y*last.W+x]>0))continue;
      if(occ.some(q=>Math.hypot(q[0]-x-.5,q[1]-y-.5)<1.6))continue;
      pool.push([x,y,dist[y*last.W+x]]);
    }
    pool.sort((a,b)=>b[2]-a[2]);
    if(!pool.length){
      for(let y=1;y<last.H-1;y++)for(let x=1;x<last.W-1;x++)if(last.map[y][x]===0&&dist[y*last.W+x]>0)pool.push([x,y,dist[y*last.W+x]]);
      pool.sort((a,b)=>b[2]-a[2]);
    }
    if(pool.length){
      const far=pool.filter(c=>c[2]>=pool[0][2]*.6),c=pick(far.length?far:pool);
      last.loot.push(['objective',1,c[0]+.5,c[1]+.5]);last.obj=[c[0]+.5,c[1]+.5];
    }
  }
  return lvs;
}

    var slot=d.slot;if(['main','sub','melee','head','body','bag','g1','g2'].indexOf(slot)<0)return;
    if(d.id==null){p.eq[slot]=null;sendMe(idx);dirty=true;return}
    var it=BYID[d.id];if(!it||!(p.inv[d.id]>0))return;
    var ok=(slotFor(it)===slot)||(it.cat==='gadget'&&!it.noSlot&&(slot==='g1'||slot==='g2'));
    if(!ok)return;
    if(slot==='g1'&&p.eq.g2===d.id)p.eq.g2=null;
    if(slot==='g2'&&p.eq.g1===d.id)p.eq.g1=null;
    p.eq[slot]=d.id;sendMe(idx);dirty=true;
  }
}

/* ---------- 感染者の画面(施設の強化) ---------- */
function placeable(tx,ty){
  var lv=G.lv,b=lv.bld;
  if(tx<b.x||ty<b.y||tx>=b.x+b.w||ty>=b.y+b.h)return false;
  if(lv.map[ty][tx]!==0)return false;
  var cx=tx+.5,cy=ty+.5;
  if(Math.hypot(cx-G.info.spawn.x,cy-G.info.spawn.y)<CFG.noPlace)return false;
  var st=lv.stairs||[];for(var i=0;i<st.length;i++)if(Math.hypot(cx-st[i].x,cy-st[i].y)<1.5)return false;
  return true;
}
function unitAt(tx,ty){var u=G.inf.units;for(var i=0;i<u.length;i++)if(Math.floor(u[i].x)===tx&&Math.floor(u[i].y)===ty)return i;return -1}
function mapClick(tx,ty){
  if(!G||G.phase==='end'||G.cam==null)return;
  var lv=G.lv,inf=G.inf,k=ty*lv.W+tx;
  if(tx<0||ty<0||tx>=lv.W||ty>=lv.H)return;
  if(G.tool==='lock'){
    if(inf.locks[k]){if(G.phase!=='prep')return;delete inf.locks[k];inf.cost=Math.min(inf.max,inf.cost+LOCKCOST);dirty=true;return}
    if(lv.map[ty][tx]===3&&inf.cost>=LOCKCOST){inf.locks[k]=1;inf.cost-=LOCKCOST;dirty=true}
    return;
  }
  var ui=unitAt(tx,ty);
  if(ui>=0){if(G.phase!=='prep')return;var u=inf.units[ui];inf.cost=Math.min(inf.max,inf.cost+UNITS[u.k].cost);inf.units.splice(ui,1);dirty=true;return}
  var def=UNITS[G.tool];if(!def||!placeable(tx,ty)||inf.cost<def.cost)return;
  inf.units.push({id:inf.nid++,k:G.tool,x:tx+.5,y:ty+.5});inf.cost-=def.cost;dirty=true;
}

  tools+='<button class="tl'+(G.tool==='lock'?' on':'')+'" data-act="tool" data-v="lock" style="--tc:#e5533d"'+(G.phase==='end'?' disabled':'')+'><b>鍵</b><span>ドアを施錠</span><small class="num">'+LOCKCOST+'</small></button>';

  else if(G.phase==='prep')hint=(G.tool==='lock'?'ドアをタップして施錠します。もう一度タップすると解除します。':'部屋の床をタップして置きます。置いた物をもう一度タップすると取り除いて、コストが戻ります。オレンジの円の中は置けません。');
  else hint=G.phase==='play'?'本編中に置くとコストを使います。置いた物は取り除けません。':'配置は固定されました。';

var TCOL={0:'#20302f',1:'#7b8b8f',2:'#4d4538',3:'#c9962b',4:'#c4452f',5:'#8a7a44'};
/* 部屋 = 壁とドアで区切られた、床のつながり。1つの部屋に1台の監視カメラ */
function calcRooms(lv){
  var W=lv.W,bd=lv.bld,id=new Int8Array(W*lv.H).fill(-1),rooms=[];
  for(var y=bd.y;y<bd.y+bd.h;y++)for(var x=bd.x;x<bd.x+bd.w;x++){
    if(id[y*W+x]>=0||(lv.map[y][x]!==0&&lv.map[y][x]!==2))continue;
    var n=rooms.length,q=[[x,y]],x0=x,x1=x,y0=y,y1=y;id[y*W+x]=n;
    for(var h=0;h<q.length;h++){
      var c=q[h];x0=Math.min(x0,c[0]);x1=Math.max(x1,c[0]);y0=Math.min(y0,c[1]);y1=Math.max(y1,c[1]);
      for(var d=0;d<4;d++){
        var nx=c[0]+(d===0?1:d===1?-1:0),ny=c[1]+(d===2?1:d===3?-1:0);
        if(nx<bd.x||ny<bd.y||nx>=bd.x+bd.w||ny>=bd.y+bd.h||id[ny*W+nx]>=0)continue;
        var v=lv.map[ny][nx];if(v!==0&&v!==2)continue;
        id[ny*W+nx]=n;q.push([nx,ny]);
      }
    }
    rooms.push({n:n,x0:x0,y0:y0,x1:x1,y1:y1,cells:q.length});
  }
  rooms=rooms.filter(function(r){return r.cells>=6});
  rooms.sort(function(a,b2){return (Math.floor(a.y0/8)-Math.floor(b2.y0/8))||(a.x0-b2.x0)});
  rooms.forEach(function(r,i){r.i=i});
  return {list:rooms,id:id};
}
function inRoom(r,x,y){var tx=Math.floor(x),ty=Math.floor(y);return tx>=r.x0&&tx<=r.x1&&ty>=r.y0&&ty<=r.y1&&G.rid[ty*G.lv.W+tx]===r.n}
function roomAt(tx,ty){
  for(var i=0;i<G.rooms.length;i++)if(inRoom(G.rooms[i],tx+.5,ty+.5))return i;
  for(var j=0;j<G.rooms.length;j++){var r=G.rooms[j];if(tx>=r.x0-1&&tx<=r.x1+1&&ty>=r.y0-1&&ty<=r.y1+1)return j}
  return -1;
}
function unitsIn(r){var n=0;G.inf.units.forEach(function(u){if(inRoom(r,u.x,u.y))n++});return n}
function survIn(r){var n=0;(G.ents||[]).forEach(function(e){if(inRoom(r,e.x,e.y))n++});return n}
function drawMap(){
  var cv=$('#cv');if(!cv||!G)return;var lv=G.lv,wrap=$('#cvw');
  var avail=Math.max(300,(wrap.clientWidth||600));
  var cam=G.cam!=null?G.rooms[G.cam]:null,ox=0,oy=0,vw=lv.W,vh=lv.H,ts;
  if(cam){ox=cam.x0-1;oy=cam.y0-1;vw=cam.x1-cam.x0+3;vh=cam.y1-cam.y0+3;ts=Math.max(14,Math.min(46,Math.floor(avail/vw),Math.floor(540/vh)))}
  else ts=Math.max(8,Math.min(24,Math.floor(avail/lv.W)));
  var w=vw*ts,h=vh*ts,dpr=2;
  G.vw={ox:ox,oy:oy,ts:ts,w:vw,h:vh};
  if(cv.width!==w*dpr||cv.height!==h*dpr){cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px'}
  var c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
  c.fillStyle='#0a0f10';c.fillRect(0,0,w,h);
  if(cam)drawCam(c,ts,cam,ox,oy,vw,vh);else drawOverview(c,ts);
}
function pmark(c,ts,x,y,txt,col,rad){
  c.beginPath();c.arc(x,y,rad,0,6.2832);c.fillStyle=col;c.fill();
  c.fillStyle='#14181a';c.font='bold '+Math.floor(rad*1.15)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(txt,x,y+1);
}
/* 俯瞰: 部屋の位置と数だけ。床の様子や敵の動きは分からない */
function drawOverview(c,ts){
  var lv=G.lv,bd=lv.bld;
  c.strokeStyle='#26363b';c.lineWidth=2;c.strokeRect(bd.x*ts,bd.y*ts,bd.w*ts,bd.h*ts);
  G.rooms.forEach(function(r){
    var x=r.x0*ts,y=r.y0*ts,w=(r.x1-r.x0+1)*ts,h=(r.y1-r.y0+1)*ts;
    c.fillStyle='#16242a';c.fillRect(x,y,w,h);
    c.strokeStyle='#3f5e68';c.lineWidth=2;c.strokeRect(x+1,y+1,w-2,h-2);
    var fs=Math.max(11,Math.min(20,Math.floor(ts*1.0)));
    c.fillStyle='#b9c7ca';c.font='bold '+fs+'px sans-serif';c.textAlign='center';c.textBaseline='middle';
    c.fillText('CAM '+(r.i+1),x+w/2,y+h/2-fs*.4);
    /* カメラの印 */
    c.beginPath();c.arc(x+10,y+10,4,0,6.2832);c.fillStyle='#e5533d';c.fill();
    var n=unitsIn(r);
    if(n){c.fillStyle='#b7d94a';c.font='bold '+Math.max(10,fs-4)+'px sans-serif';c.fillText('敵 '+n,x+w/2,y+h/2+fs*.8)}
    if(G.cam===r.i){c.strokeStyle='#e7e2d3';c.lineWidth=3;c.strokeRect(x+2,y+2,w-4,h-4)}
  });
  /* ドアの位置(目印だけ) */
  for(var yy=bd.y;yy<bd.y+bd.h;yy++)for(var xx=bd.x;xx<bd.x+bd.w;xx++){
    var v=lv.map[yy][xx],k=yy*lv.W+xx;if(G.inf.locks[k])v=4;
    if(v===3||v===4){c.fillStyle=v===4?'#e5533d':'#c9962b';c.fillRect(xx*ts+ts*.2,yy*ts+ts*.2,ts*.6,ts*.6)}
  }
  var sp=G.info.spawn,gl=G.info.goal;
  pmark(c,ts,sp.x*ts,sp.y*ts,'始','#f0902e',ts*.7);
  pmark(c,ts,gl.x*ts,gl.y*ts,gl.k==='exit'?'出':'上','#8cc152',ts*.7);
}
/* カメラ: 1つの部屋を拡大して、中のようすを詳しく見る */
function drawCam(c,ts,cam,ox,oy,vw,vh){
  var lv=G.lv;
  for(var y=oy;y<oy+vh;y++)for(var x=ox;x<ox+vw;x++){
    if(x<0||y<0||x>=lv.W||y>=lv.H)continue;
    var v=lv.map[y][x],k=y*lv.W+x;if(G.inf.locks[k])v=4;
    var px=(x-ox)*ts,py=(y-oy)*ts;
    c.fillStyle=TCOL[v];c.fillRect(px,py,ts,ts);
    if(v===0){c.strokeStyle='rgba(255,255,255,.045)';c.lineWidth=1;c.strokeRect(px+.5,py+.5,ts-1,ts-1)}
    if(v===2){c.fillStyle='rgba(0,0,0,.25)';c.fillRect(px+3,py+3,ts-6,ts-6)}
    if(v===3||v===4||v===5){c.strokeStyle='#14181a';c.lineWidth=2;c.strokeRect(px+3,py+3,ts-6,ts-6)}
    if(G.inf.locks[k]){c.fillStyle='#fff';c.font='bold '+Math.floor(ts*.55)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('鍵',px+ts/2,py+ts/2+1)}
  }
  function P(x,y){return [(x-ox)*ts,(y-oy)*ts]}
  /* 置けない範囲 */
  var sp=G.info.spawn;
  if(Math.abs(sp.x-(cam.x0+cam.x1+1)/2)<CFG.noPlace+(cam.x1-cam.x0)/2+1&&Math.abs(sp.y-(cam.y0+cam.y1+1)/2)<CFG.noPlace+(cam.y1-cam.y0)/2+1){
    var s=P(sp.x,sp.y);c.save();c.beginPath();c.rect(0,0,vw*ts,vh*ts);c.clip();
    c.beginPath();c.arc(s[0],s[1],CFG.noPlace*ts,0,6.2832);c.fillStyle='rgba(240,144,46,.12)';c.fill();c.strokeStyle='rgba(240,144,46,.8)';c.lineWidth=2;c.setLineDash([6,5]);c.stroke();c.setLineDash([]);c.restore();
  }
  /* 階段・出口・出発点(この部屋の中にあるものだけ) */
  (lv.stairs||[]).forEach(function(s){if(inRoom(cam,s.x,s.y)){var q=P(s.x,s.y);pmark(c,ts,q[0],q[1],s.to<lv.fi?'上':'下','#e7e2d3',ts*.5)}});
  var gl=G.info.goal;if(inRoom(cam,gl.x,gl.y)){var g=P(gl.x,gl.y);pmark(c,ts,g[0],g[1],gl.k==='exit'?'出':'上','#8cc152',ts*.5)}
  if(inRoom(cam,sp.x,sp.y)){var s2=P(sp.x,sp.y);pmark(c,ts,s2[0],s2[1],'始','#f0902e',ts*.5)}
  /* 最初からいる敵 */
  (lv.enemies||[]).forEach(function(e){
    if(!inRoom(cam,e[1],e[2]))return;var q=P(e[1],e[2]);
    var col=(e[0]==='mutrunner')?'#c3dc3a':(e[0]==='mutbrute')?'#4f9e78':'#7ac24a';
    c.beginPath();c.arc(q[0],q[1],ts*.34,0,6.2832);c.fillStyle=col;c.globalAlpha=.6;c.fill();c.globalAlpha=1;
  });
  /* 置いた敵 */
  G.inf.units.forEach(function(u){
    if(!inRoom(cam,u.x,u.y))return;var q=P(u.x,u.y),d=UNITS[u.k];
    c.beginPath();c.arc(q[0],q[1],ts*.42,0,6.2832);c.fillStyle=d.col;c.fill();c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
    c.fillStyle='#14181a';c.font='bold '+Math.floor(ts*.5)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(d.ch,q[0],q[1]+1);
  });
  /* 生存者(本編でここに動きが入る) */
  (G.ents||[]).forEach(function(e){
    if(!inRoom(cam,e.x,e.y))return;var q=P(e.x,e.y);
    c.beginPath();c.arc(q[0],q[1],ts*.4,0,6.2832);c.fillStyle=e.col||'#f0902e';c.fill();c.lineWidth=2;c.strokeStyle='#fff';c.stroke();
  });
  /* カメラ映像の飾り */
  c.fillStyle='#e5533d';c.beginPath();c.arc(14,14,5,0,6.2832);c.fill();
  c.fillStyle='#e7e2d3';c.font='bold 13px sans-serif';c.textAlign='left';c.textBaseline='middle';c.fillText('CAM '+(cam.i+1)+'  REC',26,14);
  c.strokeStyle='rgba(231,226,211,.35)';c.lineWidth=2;c.strokeRect(1,1,vw*ts-2,vh*ts-2);
}

/* ---------- 操作の受け口 ---------- */
function gameClick(a,b,e){
  if(a==='start')startGame();
  else if(a==='tab'){tab=b.getAttribute('data-v');dirty=true;paintGame()}
  else if(a==='buy')send(S.ctl,{t:'buy',id:b.getAttribute('data-id')});
  else if(a==='equip')send(S.ctl,{t:'eq',slot:b.getAttribute('data-slot'),id:b.getAttribute('data-id')});
  else if(a==='unequip')send(S.ctl,{t:'eq',slot:b.getAttribute('data-slot'),id:null});
  else if(a==='tool'){if(G){G.tool=b.getAttribute('data-v');dirty=true;paintGame()}}
  else if(a==='cam'){if(G){var v=b.getAttribute('data-v');G.cam=(v===''||v==null)?null:+v;dirty=true;paintGame()}}
  else if(a==='prepok')endPrep();
  else if(a==='nextround')nextRound();
}
function canvasClick(e){
  if(!G||!G.vw)return;var cv=$('#cv'),r=cv.getBoundingClientRect(),v=G.vw;
  var tx=v.ox+Math.floor((e.clientX-r.left)/(r.width/v.w)),ty=v.oy+Math.floor((e.clientY-r.top)/(r.height/v.h));
  if(G.cam==null){var ri=roomAt(tx,ty);if(ri>=0){G.cam=ri;dirty=true;paintGame()}return}
  mapClick(tx,ty);paintGame();
}

go('title');
})();
</script>
